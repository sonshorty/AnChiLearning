services:
  api:
    build:
      context: .
      dockerfile: services/anchi-learning-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
  web:
    build:
      context: .
      dockerfile: services/anchi-learning-web/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api